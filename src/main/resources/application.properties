spring.application.name=delivery-api
# Configuração do servidor
server.port=8080

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate
# create-drop: recria o schema a cada start (ótimo para dev com H2 em memória)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Garante que data.sql rode DEPOIS do Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

#  INICIALIZAÇÃO DE DADOS (data.sql / schema.sql)
# always: sempre roda | embedded (default): só em H2/HSQL/Derby | never
spring.sql.init.mode=always

# Configurações de desenvolvimento
spring.devtools.restart.enabled=true

# Configurações específicas para JDK 21
spring.jpa.open-in-view=false

#  LOGGING
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE